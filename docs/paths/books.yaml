post:
  summary: Create a new book
  tags: [ Books ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Title:
              type: string
              example: "Cien años de soledad"
            AuthorID:
              type: string
              example: "1"
            Genre:
              type: string
              example: "Fiction"
            PublicationYear:
              type: string
              example: "1967"
            isbn:
              type: string
              example: "978-0-525-95024-3"
            PageCount:
              type: string
              example: "417"

  responses:
    '201':
      description: Libro creado exitosamente
      content:
        application/json:
          example:
            status: '201'
            data:
              id: 1
              Title: "Cien años de soledad"
              AuthorID: "1"
              Genre: "Fiction"
              PublicationYear: "1967"
              isbn: "978-0-525-95024-3"
              PageCount: "417"

    '406':
      description: Datos incompletos
      content:
        application/json:
          example:
            status: '406'
            message: "El libro debe contener un Titulo, Autor, Año de Publicación, ISBN y Número de Páginas (no pueden estar vacios)"

    '500':
      description: Error del servidor
      content:
        application/json:
          example:
            status: '500'
            message: "Error:[mensaje del error]"

get:
  summary: Obtener un libro por ISBN
  tags: [ Books ]

  parameters:
  - name: isbn
    in: path
    required: true
    schema:
      type: string
      example: "978-0-525-95024-3"

  responses:
    '200':
      description: Libro leído exitosamente
      content:
        application/json:
          example:
            message: "Libro leido exitosamente"
            data:
              id: 1
              Title: "Cien años de soledad"
              AuthorID: "1"
              Genre: "Fiction"
              PublicationYear: "1967"
              isbn: "978-0-525-95024-3"
              PageCount: "417"

    '404':
      description: Libro no encontrado
      content:
        application/json:
          example:
            error: "Libro no encontrado"

    '500':
      description: Error en la Base de Datos
      content:
        application/json:
          example:
            error: "Error en la Base de Datos"
